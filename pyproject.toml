[project]
name = "raggit"
version = "0.8.0"
description = "Version control for your RAG pipeline — compare embedding models on your own data"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Joafac4" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "rich",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "pgvector>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raggit"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "examples/",
    "RAGGIT_SPECS.md",
    ".raggit/",
    ".idea/",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.urls]
Homepage = "https://github.com/Joafac4/raggit"
Repository = "https://github.com/Joafac4/raggit"
